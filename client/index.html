<!DOCTYPE html>
<!-- `dark` is set here so the FIRST PAINT is dark with no white flash on a cold
     load. ThemeProvider (next-themes) takes ownership of this class once React mounts. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Identity. One name: ArgoFX. This retires "Forex Signal Engine" (the login heading),
         "Market Analysis Platform" (the old title) and "Forex-Market-ANZ" (the repo). -->
    <title>ArgoFX — Intraday forex setups, published with the losses attached</title>
    <meta
      name="description"
      content="ArgoFX publishes intraday forex setups on five major pairs from a pre-registered method, and shows every outcome — wins and losses. Demo account, simulated results, no real money is traded."
    />
    <meta name="theme-color" content="#0E1117" />

    <!-- Canonical and social. NOTE: update these three absolute URLs in one pass when the
         custom domain is bought; nothing else in the app hardcodes the origin. -->
    <link rel="canonical" href="https://forex-market-anz.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArgoFX" />
    <meta property="og:url" content="https://forex-market-anz.pages.dev/" />
    <meta property="og:title" content="ArgoFX — Intraday forex setups, published with the losses attached" />
    <meta
      property="og:description"
      content="A pre-registered method on five major pairs, with broker-reconciled fills and every outcome shown. Demo account, simulated results, no real money is traded."
    />
    <meta property="og:image" content="https://forex-market-anz.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ArgoFX — intraday forex setups, published with the losses attached. Demo, simulated." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArgoFX — Intraday forex setups, published with the losses attached" />
    <meta
      name="twitter:description"
      content="A pre-registered method on five major pairs, with broker-reconciled fills and every outcome shown. Demo, simulated."
    />
    <meta name="twitter:image" content="https://forex-market-anz.pages.dev/og.png" />

    <!-- Icons. Generated by scripts/brand/generate-brand-assets.ts - re-run it to change them,
         do not hand-edit the binaries. Before this, /favicon.ico returned the SPA shell as
         text/html with a 200, so the tab carried no icon at all. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Roboto was loaded here and used nowhere: three render-blocking faces bought for nothing.
         Removed. Inter is the UI face, JetBrains Mono carries every number. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
